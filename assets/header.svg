<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Banner de perfil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e7"/>
      <stop offset="0.55" stop-color="#ffb8d4"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <path id="heart" d="M0,-3 C-4,-11 -16,-6 0,9 C16,-6 4,-11 0,-3Z"/>
  </defs>

  <rect width="960" height="260" rx="24" fill="url(#bg)"/>
  <rect x="8" y="8" width="944" height="244" rx="18" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round" opacity="0.8"/>

  <!-- corazoncitos flotando -->
  <g fill="#fff" opacity="0.75">
    <use xlink:href="#heart" x="90" y="190"><animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="3.2s" repeatCount="indefinite"/></use>
    <use xlink:href="#heart" x="860" y="80"><animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="2.8s" repeatCount="indefinite"/></use>
    <use xlink:href="#heart" x="780" y="215"><animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.8s" repeatCount="indefinite"/></use>
    <use xlink:href="#heart" x="170" y="60"><animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="4.1s" repeatCount="indefinite"/></use>
  </g>

  <!-- estrellitas -->
  <g fill="#fff">
    <circle cx="230" cy="40" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="35" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="170" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="110" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="480" y="125" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#9d174d">Tu Nombre</text>
  <text x="480" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#be185d">&lt;Tu rol aquí /&gt;</text>
  <text x="480" y="208" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#be185d" opacity="0.85">código · café · cosas bonitas</text>
</svg>
