<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Tarjeta de presentación estilo terminal">
  <rect width="960" height="360" rx="18" fill="#fff0f6"/>
  <rect x="3" y="3" width="954" height="354" rx="16" fill="none" stroke="#f472b6" stroke-width="2.5"/>

  <!-- barra de ventana -->
  <path d="M3 54 V21 a18 18 0 0 1 18 -18 H939 a18 18 0 0 1 18 18 V54 Z" fill="#fbcfe8"/>
  <circle cx="34" cy="29" r="6" fill="#f472b6"/>
  <circle cx="56" cy="29" r="6" fill="#fda4af"/>
  <circle cx="78" cy="29" r="6" fill="#fde68a"/>
  <text x="108" y="34" fill="#9d174d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Nyverie  ·  profile.sh</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="40" y="100" fill="#db2777" font-weight="700">$ whoami</text>
    <text x="70" y="130" fill="#831843">Nyverie ✿ Frontend</text>

    <text x="40" y="180" fill="#db2777" font-weight="700">$ cat about-me.txt</text>
    <text x="70" y="210" fill="#831843">Turning code into cute little experiences.</text>
    <text x="70" y="238" fill="#831843">Arequipa, Perú.</text>

    <text x="40" y="288" fill="#db2777" font-weight="700">$ echo $CURRENTLY_LEARNING</text>
    <text x="70" y="318" fill="#831843">C# · Svelte · Unity ♡</text>

    <text x="40" y="345" fill="#db2777" font-weight="700">$</text>
    <rect x="60" y="329" width="11" height="19" fill="#f472b6">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
